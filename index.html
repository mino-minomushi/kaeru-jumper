<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>かえるジャンパー（仮題）— 試作 r54</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d3b30;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.25)}
.hudL{display:flex;flex-direction:column;gap:1px;min-height:44px}
#hDist{font-size:32px;font-weight:900;line-height:1.1}
#hDist small{font-size:16px;margin-left:2px}
#hBest{font-size:13px;opacity:.95}
#hCombo{font-size:19px;font-weight:900;color:#ffe45e}
#hFever{font-size:19px;font-weight:900;color:#ffb347}
#hGlide{font-size:13px;font-weight:700;color:#d9ffd0}
#hDive{font-size:13px;font-weight:700;color:#cfe8ff}
#hDive.used{color:rgba(255,255,255,.55)}
.rTip{font-size:14px;font-weight:800;color:#1f6f8b;background:#e6f4f8;border-radius:10px;padding:5px 8px;margin:6px 0 0}
.rTip:empty{display:none}
.hudR{display:flex;gap:8px;pointer-events:auto}
.iconBtn{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:19px;line-height:44px;padding:0;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer;touch-action:manipulation}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(12,45,32,.42);padding:12px;box-sizing:border-box}
.overlay.show{display:flex}
#ovResult{background:rgba(12,45,32,.25)}
.panel{background:#fffdf4;border-radius:22px;max-width:430px;width:100%;max-height:100%;overflow-y:auto;padding:16px 14px 18px;box-sizing:border-box;box-shadow:0 10px 30px rgba(0,0,0,.3);color:#24392d;text-align:center;-webkit-overflow-scrolling:touch}
h1{margin:2px 0 0;font-size:30px;color:#2f8a3e;letter-spacing:.04em}
h2{margin:6px 0 10px;font-size:22px}
.note{font-size:12px;color:#7d8c80}
.desc{font-size:15px;line-height:1.65;margin:10px 0 6px;background:#eaf7e4;border-radius:12px;padding:8px 10px;font-weight:700;color:#2b5a33}
.tips{font-size:13px;color:#5d6f61;line-height:1.55;margin-bottom:8px}
.tips:empty{display:none}
.sec{font-size:14px;font-weight:800;margin:6px 0 6px;color:#3b6a44}
.total{font-size:12px;color:#6a7a6d;margin-bottom:6px}
.cards{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;padding:2px 2px 4px;text-align:left}
.card{display:flex;gap:10px;align-items:center;border:3px solid #dfe8d8;border-radius:14px;padding:6px 8px;background:#fff;cursor:pointer;flex:none}
.card.sel{border-color:#3aa84a;background:#effbe8}
.card.locked{cursor:default;background:#f1f1ee;color:#8a8a86}
.card canvas{width:72px;height:54px;flex:none}
.card .nm{font-weight:800;font-size:15px}
.card .ab{font-size:12px;line-height:1.45}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:none;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;background:#3aa84a;color:#fff;box-shadow:0 4px 0 #24753a;font-family:inherit;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #24753a}
.btn.sub{background:#e8efe3;color:#2f5a38;box-shadow:0 4px 0 #c2cdbb;font-size:15px;padding:11px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row .btn{flex:1}
.zabun{font-size:30px;font-weight:900;color:#1f6f8b;margin-top:2px}
.rDist{font-size:44px;font-weight:900;color:#24392d;line-height:1.1;margin-top:4px}
.rMsg{font-size:20px;font-weight:900;margin:4px 0;min-height:1.2em}
.rMsg.new{color:#e8590c}.rMsg.tie{color:#2f8a3e}.rMsg.near{color:#1f6f8b}
.rSmall{font-size:14px;color:#4c5e50;margin-top:2px}
.badge{display:inline-block;background:#ffd43b;color:#6b4400;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:900;margin-left:4px}
.unlock{margin-top:10px;background:#fff4d6;border-radius:14px;padding:8px}
.unlock .uh{font-weight:900;color:#c25e00;font-size:16px}
.unlock .ui{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:6px;text-align:left;font-size:13px}
.unlock canvas{width:72px;height:54px;animation:reveal 1.4s ease-out both}
@keyframes reveal{0%{filter:brightness(0);transform:scale(.8)}55%{filter:brightness(0);transform:scale(1)}75%{filter:brightness(2.2)}100%{filter:none}}
.girlBox{position:relative;height:150px;margin-top:6px}
#gCv{width:150px;height:156px;position:absolute;left:8%;bottom:0}
.bubble{position:absolute;left:calc(8% + 140px);right:2%;top:22px;background:#fff;border:3px solid #9fd39a;border-radius:16px;padding:8px 10px;font-weight:900;font-size:15px;color:#2b5a33}
.bubble:before{content:"";position:absolute;left:-12px;top:20px;border:8px solid transparent;border-right-color:#9fd39a}
.warn{color:#c92a2a;font-size:13px;font-weight:700;min-height:0}
/* r37：BIG AIR・タイトル絵・選択画面の相棒 */
#hAir{font-size:15px;font-weight:900;color:#9fe8ff}
.badge.air{background:#9fe8ff;color:#0b4a5e}
.airNote{font-size:11px;color:#5d7a80;margin-top:1px}
.tHero{position:relative;margin:-16px -14px 6px;border-radius:22px 22px 0 0;overflow:hidden;background:#dff0f4}
.tHero img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.tLogo{position:absolute;left:12px;top:6px;text-align:left}
.tLogo h1{text-shadow:0 2px 0 #fff,0 0 8px rgba(255,255,255,.9)}
.tLogo .note{color:#4f6b58;text-shadow:0 0 4px #fff}
.tHero.noart{margin:0;background:none}
.tHero.noart img{display:none}
.tHero.noart .tLogo{position:static;text-align:center}
.card .gp{width:48px;height:54px;object-fit:cover;object-position:50% 12%;border-radius:10px;flex:none;background:#fdf6e8}
.card.locked .gp{background:#e9e9e4;object-fit:contain;object-position:50% 100%}
@media (max-width:360px){.card canvas{width:56px;height:42px}.card .gp{width:40px;height:46px}}
/* r38：スタートボタン常時表示・音ボタンはタイトル絵の右上・相棒名・解放の進捗・次に狙うこと・HUD の整理 */
#bStart{position:sticky;bottom:0;z-index:1;box-shadow:0 -12px 12px #fffdf4,0 4px 0 #24753a}
#bStart:active{box-shadow:0 -12px 12px #fffdf4,0 2px 0 #24753a}
.tSound{position:absolute;right:8px;top:8px;width:36px;height:36px;line-height:36px;font-size:16px;z-index:2}
.tHero.noart .tSound{top:0;right:0}
.card .gn{font-size:12px;color:#c2577a;font-weight:800;margin-left:2px}
.pbar{height:6px;border-radius:3px;background:#e3e8de;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;border-radius:3px;background:#3aa84a}
.pnote{font-size:12px;margin-top:2px}
#rNext{font-size:15px;font-weight:900;color:#c25e00;margin:6px 0 0}
#rNext:empty{display:none}
#rNext .pbar{max-width:260px;margin:5px auto 0}
#rNext .pnote{font-weight:700}
.zabun.yay{color:#e8590c}
#hDist .skips{font-size:15px;margin-left:8px;vertical-align:middle}
#hBest .near{font-size:15px;font-weight:900;color:#ffe45e}
#hCombo .fv{font-size:13px;margin-left:8px;color:#ffb347;letter-spacing:.04em;white-space:nowrap}
#ovTitle .panel{max-width:1100px}
.tHero img[data-art="title"]{aspect-ratio:4/3;object-position:right center}
.tHero img[data-art="keyvisual"]{aspect-ratio:16/9}
.rankings{text-align:left;margin:8px 0;color:#365642}
.rankings summary{cursor:pointer;font-size:14px;font-weight:800}
.rankings table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;margin:8px 0}
.rankings caption{text-align:left;font-weight:900}
.rankings th,.rankings td{padding:4px 2px;border-bottom:1px solid #dfe8d8;overflow-wrap:anywhere}
.rankings th{text-align:left}
.rankings th:first-child{width:8%}
.rankings th:nth-child(3){width:17%}
.rankings th:nth-child(4){width:24%}
.rankings .rankCurrent{background:#fff0b4;font-weight:800}
/* r50：全員ランキングのタブ（有効時だけ差し込む） */
.rankTabs{display:flex;gap:6px;margin:8px 0 4px}
.rankTab{flex:1;padding:6px 4px;border:2px solid #9cc49a;border-radius:999px;background:#fff;color:#365642;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.rankTab.on{background:#5c9a5a;border-color:#5c9a5a;color:#fff}
.rankings .grankCap{font-size:12px;font-weight:900;margin-top:8px}
.rankings .grankStatus{font-size:12px;margin:4px 0 8px;color:#5f7a66}
/* r50 ラウンド2：タイトルの「みんなの記録」要約カードと、結果画面の全体順位バッジ（有効時だけ使う） */
.grankSummary{margin:8px 0;padding:6px 10px;border:2px solid #9cc49a;border-radius:12px;background:#f7fbf2;color:#365642;text-align:left;font-size:13px;cursor:pointer}
.grankSummary[hidden],#rGrank[hidden]{display:none}
.grankSummary .gsHead{font-size:14px;font-weight:900}
.grankSummary .gsRow{display:flex;gap:8px;align-items:baseline}
.grankSummary .gsLabel{min-width:5.5em;font-weight:800}.grankSummary .gsVal{font-weight:900;color:#c25e00}
.grankSummary .gsName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rGrank.grankRank{display:inline-block;margin-top:4px;padding:4px 14px;border-radius:999px;background:linear-gradient(#ffe88f,#f3c33d);color:#6b4100;font-size:17px;font-weight:900;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.playerName{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:800;text-align:left;margin-top:8px}
/* r46：結果画面のハイライト（その走で更新した部門の相棒の絵と見出し） */
#rHighlight{position:relative;max-width:320px;margin:6px auto 2px;border-radius:14px;overflow:hidden;background:#fdf6e8;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#rHighlight[hidden]{display:none}
#rHighlightImg{display:block;width:100%;height:auto}
#rHighlightCap{position:absolute;right:8px;bottom:6px;font-size:18px;font-weight:900;color:#c25e00;text-shadow:0 0 4px #fff,0 0 2px #fff}
.playerName input{min-width:0;flex:1;font:inherit;padding:6px;border:1px solid #9fd39a;border-radius:8px}
@media (min-width:760px){
  #ovTitle .panel{display:grid;grid-template-columns:minmax(0, 1.8fr) minmax(0, 1fr);gap:16px;align-items:start}
  .tHero{margin:0;border-radius:14px;position:sticky;top:0}
  .tHero img[data-art="title"]{aspect-ratio:16/9}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<div id="hud">
  <div class="hudL" id="hudL">

    <div id="hBest"></div>
    <div id="hAir"></div>

    <div id="hDive"></div>

  <div class="hudR">

</div>

<div id="ovTitle" class="overlay"><div class="panel">
  <div class="tHero noart" id="tHero"><img id="tArt" alt=""><div class="tLogo"><h1>かえるジャンパー</h1><div class="note">（仮題）</div></div><button class="iconBtn tSound" id="bSoundT" aria-label="ミュート">🔊</button></div>
  <div class="titleControls">
  <div class="desc">長押しで 力をためて発射！<br>葉っぱに着地する瞬間に タップでブースト！</div>

  <div class="sec" id="tHead">カエルをえらぶ</div>
  <div class="total" id="tTotal"></div>
  <label class="playerName">プレイヤー名 <input id="playerName" type="text" maxlength="24" placeholder="ゲスト" autocomplete="off"></label>
  <details class="rankings"><summary>ランキング トップ5</summary><div id="titleRanks"></div></details>
  <div class="cards" id="cards"></div>
  <button class="btn" id="bStart">スタート</button>
  </div>
</div></div>

<div id="ovPause" class="overlay"><div class="panel">
  <h2>一時停止中</h2>
  <button class="btn" id="bResume">再開</button>
  <div class="row"><button class="btn sub" id="bSoundP">🔊 音 ON</button><button class="btn sub" id="bTitleP">タイトルへ</button></div>
</div></div>

<div id="ovResult" class="overlay"><div class="panel">
  <div class="zabun" id="rZabun">ざぶん…！</div>
  <div class="girlBox"><canvas id="gCv"></canvas><div class="bubble" id="rBubble"></div></div>
  <div class="rDist" id="rDist"></div>
  <div class="rMsg" id="rMsg"></div>
  <p class="rSmall" id="rRank" role="status" hidden></p>
  <div id="rHighlight" hidden><img id="rHighlightImg" alt=""><div id="rHighlightCap"></div></div>
  <div class="rSmall" id="rBest"></div>
  <div class="rSmall" id="rAir"></div>
  <div class="rSmall" id="rSp"></div>
  <div class="rTip" id="rTip"></div>
  <div id="rNext"></div>
  <div id="rUnlock"></div>
  <div class="warn" id="rWarn"></div>
  <button class="btn" id="bRetry">もう一度</button>
  <div class="row"><button class="btn sub" id="bChange">カエルを変える</button><button class="btn sub" id="bTitle">タイトルへ</button></div>
  <details class="rankings"><summary>ランキング トップ5</summary><div id="resultRanks"></div></details>
</div></div>

<!-- ===== 中核エンジン r3（engine_fable_r3.html を無改変で埋め込み） ===== -->
<script>
/* ===== v3.1 チューニング定数（2026-11-16 試遊フィードバック対応。値はすべて仮。TUNING_NOTES.md に転記） =====
   エンジン（KaeruCore.CONFIG.ramp / CONFIG.guarantee）と描画（ZOOM / EMPH）の両方がここを参照する */
const KAERU_TUNING = {
  // A. ジャンプの成長ランプ：離陸時の初速（実際の軌道）に掛ける距離ベースの倍率。区間ごとに線形補間
  //    0m で start → fullM で full → extM で ext、以後 ext のまま
  ramp: { start: 0.55, fullM: 150, full: 1.0, extM: 600, ext: 1.1 },
  // C. 保証葉のオフセット：無操作の下降交点が「葉の中心から葉幅の offMin〜offMax」に来るよう保証葉をずらす
  //    （離陸ごとに一様乱数。向きは前後ランダム）。交点が葉の端から edgePx より内側に残るようクランプ
  //    r3.2：ずらしは廃止（0＝無操作の下降交点が葉の中心）。弱さは安全葉の倍率 sm(d) で表す（AIM_NOTES.md）
  guarantee: { offMin: 0, offMax: 0, edgePx: 4 },
  // r3.2 A. 安全葉：その離陸で新しく置いた（または動かした）保証葉。fromM 以遠では葉倍率の代わりに sm(d) を使い、
  //    コンボ倍率・FEVER 倍率を掛けず、コンボ c と FEVER 連鎖 f は増えも切れもしない。
  //    sm(d) は nearM で nearMul、farM 以遠で farMul、その間は線形（d＝接触足点の距離 m）
  //    叩き台は 0.90→0.62。計測（tests_r32/result_aim_measure.txt）で「タップのみ全 PERFECT で 100m 越え後 6〜8 着地」に
  //    合わせて 0.85→0.50 に下げた（叩き台は幸運着地で中央値 12〜13 着地・約 500m まで延びた）。AIM_NOTES.md §3
  // r51 乙案（本人の決定 2026-11-22）：ダイブ後の自前保証葉（r38.1 の分岐）に限って、PERFECT の sm の遠側を
  //    diveFarMul（0.62）まで緩める専用カーブを使う。通常の安全葉カーブ（0.85→0.50）は一切変えない
  safe: { enabled: true, fromM: 100, nearM: 100, nearMul: 0.85, farM: 400, farMul: 0.50, diveFarMul: 0.62 },
  // r3.2 C. 狙える葉の保証：fromM 以遠の葉離陸で、ダイブで狙える範囲（頂点ダイブ〜最も遅いダイブの着地点）に
  //    通常の葉が1枚もなければ1枚置く。実速度 lowSpeed 未満では中葉以上。gapPx＝他の葉との最小すき間。
  //    範囲から安全葉の区間を除いた「狙える窓」が minWindowPx 未満なら置かない（どこでダイブしても安全葉に落ちるため）
  //    r36：r32 の狙える葉の保証を復活。現行入力の300ms締切で範囲を計算する
  aimLeaf: { enabled: true, fromM: 100, lowSpeed: 1400, gapPx: 6, minWindowPx: 8 },
  // r3.5（DESIGN_R35_FABLE.md＋本人の判断 2026-11-17）：空中のタップ＝ダイブ（解放時）／長押し＝ブレーキ（保持型）、MIRACLE、赤白の花。
  //    input / miracle / flowers の enabled を false にすると、その部分は r3.2 の規則に戻る（中立設定。tests_r36/extract.py）
  //    本人の判断（2026-11-19）：ダイブ後も保証葉を更新し、その離陸の自前の保証葉は大（通常時の葉倍率 ×0.75）に固定する
  r35: {
    // tapMs＝短押しのしきい値（解放時にダイブ）、lockMs＝離陸ロック、diveAfterMs＝「ダイブした場合の接触まで」の下限
    input: { enabled: true, tapMs: 180, lockMs: 250, diveAfterMs: 300 },
    // brakeBudget＝1離陸あたりのブレーキ累計（秒。葉離陸・水切り復帰で回復）
    brake: { budget: 0.8 },
    // MIRACLE：窓＝PERFECT 窓×ratio（全幅 minWidthMs が下限、前寄せの比は同じ）。判定倍率 mul（距離で減衰しない）。
    //   pinch＝ピンチ補正（接触時の基準速度がこれ未満ならこの値とみなす）。水切りの MIRACLE 成功は clamp(v×skipFactor, skipMin, skipMax)
    miracle: { enabled: true, ratio: 0.3, minWidthMs: 30, mul: 1.25, pinch: 900, skipFactor: 0.7, skipMin: 800, skipMax: 1200 },
    flowers: {
      enabled: true, radius: 40, clearPx: 56, stepMs: 4,
      // 赤（ダイブ軌道上の矢じり形の列）。時刻は離陸からの ms（発動＝指を離した時刻）
      red: { rowContactMs: 500, bandLo: 0.35, bandHi: 0.75, sepPx: 56, minFireMs: 430, firstMs: 140, gapPx: 96, endLeadMs: 220,
        minHeight: 220, minWindowMs: 60, minRowWindowMs: 300, targetRowWindowMs: 450, coreMin: 2, minTraj: 3,
        // 本人の判断（2026-11-19）：ダイブ後の自前の保証葉は大に固定する。花は既存葉への限定もダイブ後の再配置も行わない
        requireLandLeaf: false, landMarginPx: 6 },
      // 白（ブレーキ軌道上の3輪1組。どれか1輪で水切り +1）。時刻は押下の時刻
      white: { afterApexMs: 150, minStartHeight: 420, atMs: 400, sepPx: 56, minRedPx: 96, minWindowMs: 250, tries: 3 },
      // モリアオ：滑空軌道（開始 atMs 後の点）。赤は滑空軌道に沿って n 輪（中央が大輪）
      glide: { atMs: 500, redCount: 3, afterApexMs: 150, minStartHeight: 420 },
      skip: { init: 1, max: 2 },
    },
  },
  // B. カメラの動的ズーム：下降中、接触予測の残りが min(inLeadMs, 頂点通過時の残り) を切ると対象葉へ寄り始める
  //    （smoothstep。短い飛行では頂点から、長い飛行では接触 inLeadMs 前から）。

    else { b.y += b.vy * tc - 0.5 * m.g * tc * tc - m.cap * (t - tc); b.vy = -m.cap; }
  };
  // 高さ Y を下向きに横切るまでの時間（なければ Infinity）
  const downCross = (b, m, Y) => {
    const vy = Math.max(b.vy, -m.cap), dy = b.y - Y;
    const disc = vy * vy + 2 * m.g * dy;
    if (disc < 0) return Infinity;
    const t = (vy + Math.sqrt(disc)) / m.g;
    if (t < 0) return Infinity;
    const tc = (vy + m.cap) / m.g;
    if (t <= tc) return t;
    const ytc = b.y + vy * tc - 0.5 * m.g * tc * tc;
    return tc + Math.max(0, ytc - Y) / m.cap;
  };

  /* ===== エンジン ===== */
  function createEngine(options = {}) {
    const C = CONFIG, EPS = 1e-9;
    const ang = C.angleDeg * Math.PI / 180, cosA = Math.cos(ang), sinA = Math.sin(ang);
    const HOLD = C.input.holdMs / 1000, RESERVE = C.judge.reserveMs / 1000;
    const DEG = 180 / Math.PI, diveA = C.dive.angleDeg / DEG, cosD = Math.cos(diveA), sinD = Math.sin(diveA);
    const nowFn = options.now || (() => performance.now());
    const AIR = { FLYING: 1, GLIDING: 1, BRAKING: 1, DIVING: 1 };
    const NORMAL = { g: C.gravity, k: C.drag, cap: Infinity };
    const BRAKE = { g: C.gravity * C.brake.gravityMul, k: C.brake.drag, cap: C.brake.fallCap };
    // r40：GLIDE＝滑空（推進がある系統は推進つき）、GLIDE_COAST＝推進を使い切った後の滑空。推進のない系統では同じオブジェクト
    let GLIDE = NORMAL, GLIDE_COAST = NORMAL;
    // r40：thrustLeft＝この離陸で残っている推進の時間（秒）。滑空の残量と同じく葉離陸で回復する
    let thrustLeft = 0;
    const thrustFull = () => (F.glide && F.glide.thrust > 0 && F.glide.thrustMax > 0) ? F.glide.thrustMax / F.glide.thrust : 0;
    const modeOf = st => st === 'BRAKING' ? BRAKE : st === 'GLIDING' ? (thrustLeft > EPS ? GLIDE : GLIDE_COAST) : NORMAL;
    // 滑空 gl 秒（うち推進 th 秒）の区間列 [[モード, 秒], …]。推進のない系統は [[GLIDE, gl]]（従来と同じ）
    const glidePhases = (gl, th) => {
      if (!(th > EPS) || GLIDE === GLIDE_COAST) return [[GLIDE_COAST, gl]];
      return th < gl ? [[GLIDE, th], [GLIDE_COAST, gl - th]] : [[GLIDE, gl]];
    };

    const listeners = {};
    const on = (name, fn) => { (listeners[name] || (listeners[name] = new Set())).add(fn); return () => listeners[name].delete(fn); };
    const emit = (name, p) => {
      const s = listeners[name]; if (s) for (const fn of s) fn(p);
      const a = listeners['*']; if (a) for (const fn of a) fn(name, p);
    };

    // r39：bigAirPure／highAir／glideAir は開始時のベスト（null＝渡されていない）
    const prof = { frogId: 'nihon', best: 0, total: 0, cheer: true, seed: null, bigAirBest: 0, bigAirPure: null, highAir: 0, glideAir: 0 };
    let frog = FROGS[0], variantId = 'nihon', F = effectiveParams('nihon', true);
    let state = 'TITLE', pausedFrom = null;
    const b = { x: C.startX, y: C.leafY, vx: 0, vy: 0 };
    let leaves = [], leafSeq = 0, genEdge = 0, noGen = false, rngA, rngB, seedUsed = 0;
    let flower = null, flowerSeq = 0, guar = null, guarOwn = null, guarEligible = false, guarSide = 1, guarU = 0.5;
    // v3.1：この離陸で実際の軌道に掛けた倍率（実速度÷基準速度）。接触時に基準速度へ戻すのに使う
    let launchScale = 1;
    // r3.2：離陸の通し番号（安全葉の判定に使う）と、狙える葉の保証専用の乱数（rngA/rngB の列を変えないため別系統）
    let tkSeq = 0, rngC = null, aimRange0 = null;
    // r3.5：設定は呼ぶたびに読む（テストが中立設定へ切り替えられるように）
    const R5 = C.r35, in5 = () => !!R5.input.enabled, fl5 = () => !!R5.flowers.enabled, mi5 = () => !!R5.miracle.enabled;
    // rngD＝花の配置専用の乱数（葉・保証葉の rngA/rngB の列を変えない）。tkT/tkJ＝この離陸の物理時刻・判定時刻
    // holdDone＝この押下の保持 180ms の判定が済んだ。brakeBudget＝この離陸のブレーキ残量（秒、ブレーキ中は brakeLeft が残量）
    // skipStock＝水切りの残り回数（r3.2 の「1プレイ1回」は init=1・白の花なしと同じ）
    let rngD = null, tkT = 0, tkJ = 0, holdDone = false, brakeBudget = 0, skipStock = 1;
    // flowers＝この飛行の花（赤・白）。groups＝群れ（赤1つ・白1つまで）
    let flowers = [], groups = [], groupSeq = 0, fstats = null;
    let tJudge = 0, tPhys = 0, lastReal = null;
    const queue = [];
    let down = false, hold = false, holdT = 0, reserved = null;
    let chargeMs = 0, stateT = 0, hitstop = 0, retryT = 0, pend = null, launchV = null;
    const feverDistances = [];
    let combo = 0, maxCombo = 0, fever = false, feverLeft = 0, feverElapsed = 0;
    // r47：現在の速度上限（FEVER 中は C.fever.maxSpeed、それ以外は C.maxSpeed）。FEVER でないときは従来の C.maxSpeed そのもの
    //   （C.fever.maxSpeed／goldRate が null なら FEVER 中も通常の値、upgradeS が 0 なら格上げなし＝r46 と同じ。継承テストの中立化用）
    const capSpeed = () => (fever && C.fever.maxSpeed != null ? C.fever.maxSpeed : C.maxSpeed);
    let glideLeft = 0, brakeLeft = 0;
    let diveUsed = false, diveStartY = null, refIn = null, sunkAfterDive = false;
    let maxX = C.startX, nextMs = C.milestones[0], bestAtStart = 0, bestPassed = false;
    let landings = 0, firstPlay = false, stats = null, result = null;
    let nextC = null, nextDirty = true, imminentFired = false;
    let lastGrade = 'NONE', lastNearMiss = false, lastPose = 'idle';
    // r37 BIG AIR（記録専用。物理・判定・乱数には触れない）：tkX＝この離陸の足点 x、airBestAtStart＝プレイ開始時の全体ベスト、
    // airRunBest＝このプレイで葉に着地したジャンプの最大、airRunAt＝そのジャンプの着地時の総距離、airRecorded＝このプレイで更新演出を出したか
    let tkX = C.startX, airBestAtStart = 0, airRunBest = 0, airRunAt = 0, airRecorded = false;
    // r39 BIG AIR v2：segGlide＝この区間の累積滑空（秒、GLIDING の間）、segApexY＝この区間の頂点の y（高さは葉の高さ C.leafY 基準）
    // air*＝滑空なし区間（bigAirPure。airBestAtStart はその開始時のベスト）、high*＝HIGH AIR、glide*＝滑空区間（滑空能力のある系統のみ）
    let segGlide = 0, segApexY = C.leafY;
    let airPureRun = 0, highStart = 0, highRun = 0, highRecorded = false, glideStart = 0, glideRun = 0, glideRecorded = false;
    const canGlide = () => !!(frog.params && frog.params.glide); // 系統の定義に滑空能力があるか（モリアオ固定の分岐にしない）

    const setState = to => { if (to === state) return; const from = state; state = to; emit('state', { from, to }); };
    const meters = () => Math.max(0, maxX - C.startX) / C.pxPerMeter;

    /* ----- 葉 ----- */
    const mkLeaf = (x, size, seed) => ({
      id: ++leafSeq, x, y: C.leafY, w: C.leaf[size].w, size, gold: false,
      guaranteed: false, active: true, start: false, seed,
      safe: false, safeTk: 0, aim: false, // r3.2：safe＝描画用の見た目フラグ、safeTk＝安全葉として置いた離陸番号（判定はこちら）
    });
    // r3.2：自前の保証葉を置いた／動かしたら、この離陸の安全葉にする（葉の中心が safe.fromM 以遠のときだけ）
    const markSafe = lf => {
      const on = C.safe.enabled && (lf.x - C.startX) / C.pxPerMeter >= C.safe.fromM;
      lf.safeTk = on ? tkSeq : 0; lf.safe = on;
    };
    const isSafe = lf => !!lf && lf.safeTk !== 0 && lf.safeTk === tkSeq;
    const inRest = d => d >= C.leaf.restEvery && (d % C.leaf.restEvery) < C.leaf.restLen;
    const pickSize = (xpx, r) => {
      const d = (xpx - C.startX) / C.pxPerMeter;
      if (inRest(d)) return 'L';
      const pL = Math.max(C.leaf.sizeLMin, C.leaf.sizeL0 - C.leaf.sizeLStep * Math.floor(d / 100));
      return r < pL ? 'L' : r < pL + C.leaf.sizeM ? 'M' : 'S';
    };
    const genLeaf = () => {
      const r1 = rngA(), r2 = rngA(), r3 = rngA();
      const d = (genEdge - C.startX) / C.pxPerMeter, rest = inRest(d), L = C.leaf;
      // r47：FEVER 中は小葉の半分（r3 < C.fever.upgradeS＝0.5）を中葉に格上げ（gap の計算より前。乱数は r1〜r3 の3つのまま）
      const size0 = pickSize(genEdge, r1), size = fever && size0 === 'S' && r3 < C.fever.upgradeS ? 'M' : size0;
      const gap = rest ? L.restGap : Math.min(L.gapMax, L.gapBase + L.gapStep * Math.floor(d / 100)) * (size === 'S' ? L.smallGap : 1);
      const lf = mkLeaf(genEdge + gap + L[size].w / 2, size, r3);
      lf.gold = !rest && L.goldEnabled && r2 < (fever && C.fever.goldRate != null ? C.fever.goldRate : L.goldRate);   // r47：FEVER 中に生成した葉は金の葉率 0.35
      leaves.push(lf);
      genEdge = lf.x + lf.w / 2;
    };
    const ensureLeaves = toX => { if (noGen) return; while (genEdge < toX) genLeaf(); };
    const leafAt = (x, exclude = null) => {
      let hit = null, hd = Infinity;
      for (const lf of leaves) {
        if (!lf.active || lf === exclude) continue;
        const d = Math.abs(x - lf.x);
        if (d > lf.w / 2) continue;
        if (lf.guaranteed) return lf;
        if (d < hd) { hd = d; hit = lf; }
      }
      return hit;
    };

    /* ----- 接触予測 ----- */
    // asIs=false: 無操作（滑空は解放扱い） / anyLeaf=true: 葉の有無に関わらず葉面交点を返す
    const predict = (asIs, anyLeaf, exclude = null) => {
      const p = { x: b.x, y: b.y, vx: b.vx, vy: b.vy };
      const st = (state === 'GLIDING' && !asIs) || !AIR[state] ? 'FLYING' : state;
      // r40：区間列（ブレーキ／滑空〔推進つき→推進なし〕→通常物理）。推進のない系統では従来の「1区間＋通常物理」と同じ
      const phs = st === 'BRAKING' ? [[BRAKE, brakeLeft]] : st === 'GLIDING' ? glidePhases(glideLeft, thrustLeft) : [];
      phs.push([NORMAL, Infinity]);
      let t0 = 0;
      // r3.5：接触時の実速度 sp も返す（ピンチ表示用。挙動には使わない）
      const spAt = (m, t) => { const q = { x: p.x, y: p.y, vx: p.vx, vy: p.vy }; move(q, m, t); return Math.hypot(q.vx, q.vy); };
      for (const [m, seg] of phs) {
        const tL = downCross(p, m, C.leafY);
        if (tL <= seg && isFinite(tL)) {
          const x = xAt(p, m, tL);
          ensureLeaves(x + 200);
          const lf = leafAt(x, exclude);
          if (lf || anyLeaf) return { kind: 'leaf', leaf: lf, t: t0 + tL, x, sp: spAt(m, tL) };
        }
        const tW = downCross(p, m, 0);
        if (tW <= seg && isFinite(tW)) return { kind: 'water', leaf: null, t: t0 + tW, x: xAt(p, m, tW), sp: spAt(m, tW) };

        move(p, m, seg); t0 += seg;
      }
      return null;
    };
    const getNext = () => {
      if (nextDirty) {
        const r = predict(true, false);
        nextC = r ? { kind: r.kind, leaf: r.leaf, at: tPhys + r.t, x: r.x, sp: r.sp } : null;
        nextDirty = false;
        if (imminentFired && nextC && nextC.at - tPhys > RESERVE + EPS) imminentFired = false;
      }
      return nextC;
    };

    /* ----- 到達保証 ----- */
    const setGuar = lf => { if (guar && guar !== lf) guar.guaranteed = false; guar = lf; if (lf) lf.guaranteed = true; };
    // 無操作の交点を葉の中心から端寄りにずらす量（v3.1：葉幅の offMin〜offMax、離陸ごとに一様乱数）。
    // 交点が葉の端から edgePx 以上内側に残るようにクランプする（到達保証を崩さない）
    const guarShift = (xc, w) => {
      const G = C.guarantee, f = G.offMin + (G.offMax - G.offMin) * guarU;
      return guarSide * clamp(f * w, 0, Math.max(0, w / 2 - G.edgePx));
    };
    const updateGuarantee = () => {
      if (!guarEligible) return;
      // ダイブ後は通常葉を優先し、自前の保証葉はサイズと幅をそろえてから動かす。
      if (diveUsed && guarOwn) {
        guarOwn.size = 'L'; guarOwn.w = C.leaf.L.w;
      }
      const r = predict(false, true, diveUsed ? guarOwn : null);
      if (!r || r.kind !== 'leaf') return;
      if (r.leaf) setGuar(r.leaf);
      else if (guarOwn) {
        setGuar(null);
        guarOwn.x = r.x + guarShift(r.x, guarOwn.w); setGuar(guarOwn); markSafe(guarOwn);
        emit('guaranteeMoved', { leafId: guarOwn.id, x: guarOwn.x, safe: guarOwn.safe });
      } else {
        const sizeRoll = rngB();
        guarOwn = mkLeaf(r.x, diveUsed ? 'L' : pickSize(r.x, sizeRoll), rngB());
        guarOwn.x += guarShift(r.x, guarOwn.w);
        leaves.push(guarOwn); setGuar(guarOwn); markSafe(guarOwn);
        emit('leafSpawn', { leafId: guarOwn.id, guaranteed: true, safe: guarOwn.safe, x: guarOwn.x, size: guarOwn.size });
      }
      nextDirty = true;
    };

    /* ----- r3.2 ダイブ照準（表示専用の前向きシミュレーション。エンジンの状態・乱数・葉の生成には一切触れない） ----- */
    // 通常物理の as-is 接触までの時間（getNext と同じ規則：葉の高さの交点に葉があれば葉、なければ水面）
    const nextContactT = p => {
      const tL = downCross(p, NORMAL, C.leafY);
      if (isFinite(tL) && leafAt(xAt(p, NORMAL, tL))) return tL;
      return downCross(p, NORMAL, 0);
    };
    // r39：sp' = min(1.3×sp, max(2200, sp))。上限を超えて飛んでいる最中（sp>2200）は減速も上乗せもしない。sp≤2200 は従来の演算そのまま
    // r47：上限は capSpeed()（FEVER 中は 2600）
    const flowerBoost = p => {
      const cap = capSpeed();
      if (Math.hypot(p.vx, p.vy) > cap) return;
      p.vx *= C.flower.boost; p.vy *= C.flower.boost;
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > cap) { p.vx *= cap / sp; p.vy *= cap / sp; }
    };
    // 状態 p でダイブを発動したときの、葉の高さへの下降交点（花・葉は見ない。範囲の計算用）
    const diveLand = p => {
      const sp = Math.hypot(p.vx, p.vy), q = { x: p.x, y: p.y, vx: sp * cosD, vy: -sp * sinD };
      const tL = downCross(q, NORMAL, C.leafY);
      return isFinite(tL) ? xAt(q, NORMAL, tL) : null;
    };
    // ダイブで狙える範囲：発動時刻 τ ∈ [max(0, 頂点), 接触 − 220ms] の着地点の最小〜最大（p0 は FLYING の状態、tContact は p0 からの接触時刻）
    const aimRangeFrom = (p0, tContact) => {
      const tA = Math.max(0, p0.vy / C.gravity), tZ = tContact - RESERVE - 1e-6;
      if (!isFinite(tZ) || !(tZ > tA)) return null;
      let x0 = Infinity, x1 = -Infinity;
      const N = 16, p = { x: 0, y: 0, vx: 0, vy: 0 };
      for (let i = 0; i <= N; i++) {
        p.x = p0.x; p.y = p0.y; p.vx = p0.vx; p.vy = p0.vy;
        move(p, NORMAL, tA + (tZ - tA) * i / N);
        const x = diveLand(p);
        if (x != null) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
      }
      return x0 <= x1 ? { x0, x1, tA, tZ } : null;
    };
    // 「いま押し始めたら」のダイブ着地点。保持中なら残りの保持時間で計算する。
    // stepAir と同じ規則（保持 180ms 到達・下降中・接触まで 220ms より手前）で発動を判定し、1/120 秒の刻みで進める
    const simPressDive = () => {
      if (state !== 'FLYING' || F.glide || diveUsed) return null;
      const p = { x: b.x, y: b.y, vx: b.vx, vy: b.vy };
      const need = hold ? Math.max(0, HOLD - holdT) : HOLD;
      let t = 0, tp = tPhys, fl = flower ? { x: flower.x, y: flower.y } : null, approx = false;
      const sub = () => Math.max(1e-9, (Math.floor(tp / C.substep + 1e-6) + 1) * C.substep - tp);
      for (let guard = 0; guard < 4000; guard++) {
        let h = sub();
        if (need - t > EPS) h = Math.min(h, need - t);
        else if (p.vy > 1e-6) h = Math.min(h, p.vy / C.gravity + 1e-7);
        else break;
        const tL = downCross(p, NORMAL, C.leafY);
        if (tL <= h && leafAt(xAt(p, NORMAL, tL))) return null;   // ダイブ成立の前に葉へ接触する
        if (downCross(p, NORMAL, 0) <= h) return null;
        if (fl) {
          const th = flowerHitTime(NORMAL, h, p, fl);
          // 花を取ると到達保証が更新される（保証葉が動く）。速度の加速だけ反映し、予測は近似扱いにする
          if (th != null) { move(p, NORMAL, th); t += th; tp += th; flowerBoost(p); fl = null; approx = true; continue; }
        }
        move(p, NORMAL, h); t += h; tp += h;
      }
      const tn = nextContactT(p);

      const tFire = t;
      for (let guard = 0; guard < 4000; guard++) {
        const h = sub();
        const tL = downCross(q, NORMAL, C.leafY);
        if (tL <= h) {
          const x = xAt(q, NORMAL, tL), lf = leafAt(x);
          return { x, leafId: lf ? lf.id : null, onLeaf: !!lf, safe: isSafe(lf), size: lf ? lf.size : null, approx,
            fireInMs: tFire * 1000, etaMs: (t + tL) * 1000, holding: hold };
        }
        if (downCross(q, NORMAL, 0) <= h) return null;
        if (fl) {
          const th = flowerHitTime(NORMAL, h, q, fl);
          if (th != null) { move(q, NORMAL, th); t += th; tp += th; flowerBoost(q); fl = null; continue; }
        }
        move(q, NORMAL, h); t += h; tp += h;
      }
      return null;
    };
    // r3.2 C. 狙える葉の保証（離陸時に1回）。乱数は専用の rngC だけを使う。
    //   「狙える窓」＝ダイブで狙える範囲 [x0, x1] から安全葉の区間（と手前のすき間 gapPx）を除いた部分（安全葉の上に落ちるダイブは安全葉の着地になるため）。
    //   窓に通常の葉が「狙える形で」1枚もなければ（重なり ≥ min(葉幅/2, 窓幅)）、窓に1枚置く。置く葉は安全葉と重ねない。
    //   窓が minWindowPx 未満（範囲がほぼ安全葉の上＝どこでダイブしても安全葉に落ちる）なら置けないので blocked として記録する
    const ensureAimLeaf = va => {
      const A = C.aimLeaf;
      aimRange0 = null;
      if (!A.enabled || F.glide || meters() < A.fromM) return;
      const rg = in5() ? aimRange35() : aimRangeFrom(b, downCross(b, NORMAL, C.leafY));
      aimRange0 = rg;
      if (!rg) return;
      const sf = guar && isSafe(guar) ? guar : null, gap = A.gapPx;
      // 狙える窓：範囲から安全葉の区間と、その手前のすき間 gapPx を除いた部分（すき間に落ちるダイブは水面）
      const wx0 = rg.x0, wx1 = sf ? Math.min(rg.x1, sf.x - sf.w / 2 - gap) : rg.x1, px1 = wx1;
      rg.wx0 = wx0; rg.wx1 = wx1;
      const ov = (lf, a, z) => Math.min(z, lf.x + lf.w / 2) - Math.max(a, lf.x - lf.w / 2);
      const aimable = (lf, a, z) => z - a > 0 && ov(lf, a, z) >= Math.min(lf.w / 2, z - a) - 1e-9;
      const hits = leaves.filter(lf => lf.active && !isSafe(lf) && aimable(lf, wx0, wx1));
      if (hits.length) { rg.covered = hits.length; return; }
      if (!(px1 - wx0 >= A.minWindowPx)) { rg.blocked = true; return; }
      const r1 = rngC(), r2 = rngC(), mid = (wx0 + px1) / 2;
      let size = pickSize(mid, r1);
      if (va < A.lowSpeed && size === 'S') size = 'M';
      const w = C.leaf[size].w;
      const clearOf = (cx, lf) => cx + w / 2 + gap <= lf.x - lf.w / 2 + 1e-6 || cx - w / 2 - gap >= lf.x + lf.w / 2 - 1e-6;
      const ok = (cx, strict) => {
        if (sf && !clearOf(cx, sf)) return false;
        if (!aimable({ x: cx, w }, wx0, px1)) return false;
        return !strict || leaves.every(lf => !lf.active || lf === sf || clearOf(cx, lf));
      };
      const lo = wx0 - w / 2, hi = px1 + w / 2;
      // 窓が葉の半幅より狭いと、置ける位置は「安全葉側のすき間に右端を付ける」1点だけになるので、端に寄せた位置も候補に入れる
      const flush = [px1 - w / 2, wx0 + w / 2];
      const search = strict => {
        for (let k = 0; ; k++) {
          const a = mid + 2 * k, z = mid - 2 * k;
          if (a > hi && z < lo) break;
          if (a <= hi && ok(a, strict)) return a;
          if (z >= lo && ok(z, strict)) return z;
        }
        for (const f of flush) if (ok(f, strict)) return f;
        return null;
      };
      let cx = search(true), overlap = false;
      if (cx == null) { cx = search(false); overlap = true; }   // 他の通常の葉とは重なってもよい（安全葉とは重ねない）
      if (cx == null) { rg.blocked = true; return; }
      const lf = mkLeaf(cx, size, r2); lf.aim = true;
      leaves.push(lf);
      rg.placed = lf.id;
      emit('leafSpawn', { leafId: lf.id, guaranteed: false, aim: true, safe: false, x: lf.x, size, overlap, range: [rg.x0, rg.x1], window: [wx0, px1] });
    };

    /* ===== r3.5：前向き計算（花の配置・取得窓。エンジンの状態・乱数・葉の生成には触れない） ===== */
    const cp = p => ({ x: p.x, y: p.y, vx: p.vx, vy: p.vy });
    const toDive = p => { const sp = Math.hypot(p.vx, p.vy); p.vx = sp * cosD; p.vy = -sp * sinD; return p; };
    const stateAt = (p0, t) => { const q = cp(p0); move(q, NORMAL, t); return q; };
    // 状態 p でダイブした場合の接触までの時間（葉の高さの交点に葉があれば葉、なければ水面）
    const diveContact = p => nextContactT(toDive(cp(p)));
    // 区間 [0,h]（モード m）で花 fl の半径 R に入る最初の時刻（なければ null）。区間内の軌道はほぼ直線なので
    // 弦で粗く除外 → 三分探索で最接近点 → 二分法で入る時刻。エンジンの取得・配置・予測で同じ関数を使う（刻みの切り方に依存しない）
    const segS = { x: 0, y: 0, vx: 0, vy: 0 };
    const segHit = (pa, m, h, fl, R) => {
      if (!(h > 0)) return null;
      const q = cp(pa); move(q, m, h);
      const dx = q.x - pa.x, dy = q.y - pa.y, l2 = dx * dx + dy * dy;
      const u = l2 > 0 ? clamp(((fl.x - pa.x) * dx + (fl.y - pa.y) * dy) / l2, 0, 1) : 0;
      if (Math.hypot(pa.x + u * dx - fl.x, pa.y + u * dy - fl.y) > R + 2) return null;
      const s = segS;
      const dist = t => { s.x = pa.x; s.y = pa.y; s.vx = pa.vx; s.vy = pa.vy; move(s, m, t); return Math.hypot(s.x - fl.x, s.y - fl.y); };
      if (dist(0) <= R) return 0;
      let lo = 0, hi = h;
      for (let i = 0; i < 44; i++) { const a = lo + (hi - lo) / 3, z = hi - (hi - lo) / 3; if (dist(a) <= dist(z)) hi = z; else lo = a; }
      const tm = (lo + hi) / 2;
      if (dist(tm) > R) return null;
      lo = 0; hi = tm;
      for (let i = 0; i < 48; i++) { const mid = (lo + hi) / 2; if (dist(mid) <= R) hi = mid; else lo = mid; }
      return hi;
    };
    // 区間列 phases（[{m, dur}]。その後は通常物理）に沿って 1/120 秒刻みで進め、各刻みで cb(p, m, h, t) を呼ぶ。
    // 葉の高さ（または水面）へ下降交差したら止まる。cb が true を返しても止まる。返り値は止まった時刻
    const walk = (p0, phases, cb, tMax = 20) => {
      const p = cp(p0); let t = 0;
      for (const ph of phases.concat([{ m: NORMAL, dur: Infinity }])) {
        let left = ph.dur;
        while (left > 1e-12 && t < tMax) {
          let h = Math.min(C.substep, left);
          const tX = Math.min(downCross(p, ph.m, C.leafY), downCross(p, ph.m, 0)), end = tX <= h;
          if (end) h = tX;
          if (cb && cb(p, ph.m, h, t)) return t;
          move(p, ph.m, h); t += h; left -= h;
          if (end) return t;
        }
      }
      return t;
    };
    // 点 (x, y) と折れ線 pts（[[x,y],…]）の距離
    const polyDist = (pts, x, y) => {
      let d = Infinity;
      for (let i = 1; i < pts.length; i++) {
        const ax = pts[i - 1][0], ay = pts[i - 1][1], dx = pts[i][0] - ax, dy = pts[i][1] - ay;
        if (Math.min(ax, pts[i][0]) > x + d || Math.max(ax, pts[i][0]) < x - d) continue;
        const l2 = dx * dx + dy * dy, u = l2 > 0 ? clamp(((x - ax) * dx + (y - ay) * dy) / l2, 0, 1) : 0;
        d = Math.min(d, Math.hypot(ax + u * dx - x, ay + u * dy - y));
      }
      return d;
    };
    const pathPts = (p0, phases) => { const pts = [[p0.x, p0.y]]; walk(p0, phases, (pa, m, h) => { const s = cp(pa); move(s, m, h); pts.push([s.x, s.y]); }); return pts; };
    // 弧長 s の位置（折れ線上の線形補間）。返り値 { x, y, i }（i は刻みの番号＝時刻 i/120 秒付近）
    const atArc = (pts, s) => {
      let acc = 0;
      for (let i = 1; i < pts.length; i++) {
        const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        if (acc + l >= s) { const u = l > 0 ? (s - acc) / l : 0; return { x: pts[i - 1][0] + u * (pts[i][0] - pts[i - 1][0]), y: pts[i - 1][1] + u * (pts[i][1] - pts[i - 1][1]), i }; }
        acc += l;
      }
      return null;
    };
    const arcAtStep = (pts, i) => { let acc = 0; for (let k = 1; k <= Math.min(i, pts.length - 1); k++) acc += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); return acc; };
    // 1本の操作軌道 path（{p0, phases}）で、花 list のうち取れるもの（id の集合）
    const pathHits = (p0, phases, list, R) => {
      const got = new Set();
      walk(p0, phases, (pa, m, h) => { for (const f of list) if (!got.has(f.id) && segHit(pa, m, h, f, R) != null) got.add(f.id); });
      return got;
    };
    // 操作時刻の格子（ms）ごとの取得集合から、花ごとの最長の連続区間と、群れ全体の最長の連続区間を求める
    const windowsOf = (grid, list) => {
      const run = (pred) => {
        let best = null, a = null, prev = null;
        for (const g of grid) {
          if (pred(g.hits)) { if (a == null) a = g.ms; prev = g.ms; if (!best || prev - a > best[1] - best[0]) best = [a, prev]; }
          else a = null;
        }
        return best;
      };
      for (const f of list) {
        // A single advertised interval must describe every successful grid time.
        // Reject disconnected hit sets rather than hiding a second acquisition window.
        let starts = 0, was = false;
        for (const g of grid) { const yes = g.hits.has(f.id); if (yes && !was) starts++; was = yes; }
        f.window = starts === 1 ? run(h => h.has(f.id)) : null;
      }
      return run(h => list.some(f => h.has(f.id)));
    };
    const msW = w => (w ? w[1] - w[0] : -1);

    // 赤い列（ダイブ軌道上の矢じり形）。b0＝離陸直後の状態、Tc＝無操作の接触（秒）、u＝乱数、ctx＝{ noop: 無操作軌道の折れ線 }
    const placeRed = (b0, Tc, u, ctx) => {
      const FL = R5.flowers, P = FL.red, R = FL.radius, step = FL.stepMs / 1000, lo0 = P.minFireMs / 1000, after = R5.input.diveAfterMs / 1000;
      const dc = tau => diveContact(stateAt(b0, tau));
      // 1. 列に使える区間 S：ダイブ後の接触まで rowContactMs 以上（発動は離陸ロック＋短押しの後）
      let S0 = null, SZ = null;
      for (let tau = lo0; tau < Tc - 1e-9; tau += step) {
        if (dc(tau) >= P.rowContactMs / 1000 - EPS) { if (S0 == null) S0 = tau; SZ = tau; } else if (S0 != null) break;
      }
      if (S0 == null || !(SZ - S0 > 0.1)) return { fail: 'S' };
      const apex = Math.max(0, b0.vy / C.gravity), lo = Math.max(S0, apex);
      if (!(SZ - lo > 0.05)) return { fail: 'S' };
      const bA = lo + P.bandLo * (SZ - lo), bZ = lo + P.bandHi * (SZ - lo), target = bA + u * (bZ - bA);
      // 2. 芯の時刻。既存葉への着地を条件にする設定では、着地点が既存葉の中心付近に来る時刻を選ぶ
      const landX = tau => diveLand(stateAt(b0, tau));
      let core = null;
      if (P.requireLandLeaf) {
        const xa = landX(lo), xz = landX(SZ), cands = [];
        for (const lf of leaves) {
          if (!lf.active || !(lf.x >= Math.min(xa, xz)) || !(lf.x <= Math.max(xa, xz))) continue;
          let a = lo, z = SZ;
          for (let i = 0; i < 50; i++) { const mid = (a + z) / 2; if (landX(mid) < lf.x) a = mid; else z = mid; }
          const tc = (a + z) / 2, q = toDive(stateAt(b0, tc)), tL = downCross(q, NORMAL, C.leafY);
          if (!isFinite(tL)) continue;
          const x = xAt(q, NORMAL, tL), hit = leafAt(x);
          if (!hit || Math.abs(x - hit.x) > hit.w / 2 - P.landMarginPx) continue;
          cands.push({ tau: tc, leaf: hit, score: (tc >= bA && tc <= bZ ? 0 : 1000) + Math.abs(tc - target) });
        }
        cands.sort((a, c) => a.score - c.score);
        core = cands[0] || null;
        if (!core) return { fail: 'noLeaf' };
      } else core = { tau: target, leaf: null };
      // 花の位置：その軌道で、発動 firstMs 以降・無操作軌道から clearPx 以上離れた最初の点から、弧長 gapPx ごと
      const trajFlowers = (tau, n) => {
        const s0 = stateAt(b0, tau), q = toDive(cp(s0)), pts = pathPts(q, []), tcon = dc(tau), out = [];
        let i0 = Math.ceil(P.firstMs / 1000 / C.substep - 1e-9);
        while (i0 < pts.length && polyDist(ctx.noop, pts[i0][0], pts[i0][1]) < FL.clearPx + 4) i0++;
        if (i0 >= pts.length) return out;
        const a0 = arcAtStep(pts, i0);
        for (let k = 0; k < n; k++) {
          const at = atArc(pts, a0 + P.gapPx * k);
          if (!at) break;
          const tAt = at.i * C.substep;
          if (at.y < P.minHeight || tAt > tcon - P.endLeadMs / 1000 || polyDist(ctx.noop, at.x, at.y) < FL.clearPx) continue;
          out.push({ x: at.x, y: at.y, k });
        }
        return out;
      };
      const coreF = trajFlowers(core.tau, 3);
      if (coreF.length < P.coreMin) return { fail: 'core' };
      // 3. Δ：隣の軌道との間隔が sepPx になる発動時刻のずれ（芯の基準点から隣の軌道までの距離で解く）
      const ref = coreF[Math.min(1, coreF.length - 1)];
      const distTo = tau => { const q = toDive(stateAt(b0, tau)); return polyDist(pathPts(q, []), ref.x, ref.y); };
      let dA = 0.004, dZ = 0.4;
      if (distTo(core.tau + dZ) < P.sepPx) return { fail: 'delta' };
      for (let i = 0; i < 30; i++) { const mid = (dA + dZ) / 2; if (distTo(core.tau + mid) < P.sepPx) dA = mid; else dZ = mid; }
      const delta = Math.round(dZ / step) * step || step;
      // 4. K 本（列全体の窓が targetRowWindowMs 以上になる本数。5 か 7）
      const half = 5 * delta >= P.targetRowWindowMs / 1000 ? 2 : 3;
      const list = [];
      for (let j = -half; j <= half; j++) {
        const tau = core.tau + j * delta;
        if (tau < lo0 || tau >= Tc || !(dc(tau) >= after - EPS)) continue;
        const n = j === 0 ? 3 : Math.abs(j) === 1 ? 2 : 1;
        const fs = j === 0 ? coreF : trajFlowers(tau, n);
        for (const f of fs) list.push({ x: f.x, y: f.y, kind: 'red', traj: j, k: f.k, big: j === 0 && f.k === 1, value: j === 0 && f.k === 1 ? 2 : 1 });
      }
      // 5. 取得窓：発動時刻を stepMs ずつ動かして、実際の規則（ダイブ後の接触 diveAfterMs 以上）で前向きに計算する
      const grid = [];
      list.forEach((f, i) => { f.id = -(i + 1); });
      const g0 = R5.input.lockMs / 1000, g1 = Tc - 1e-6;
      for (let k = Math.ceil(g0 / step - 1e-9); k * step <= g1 + 1e-12; k++) {
        const tau = k * step, s = stateAt(b0, tau);
        if (!(diveContact(s) >= after - EPS)) { grid.push({ ms: Math.round(tau * 1000), hits: new Set() }); continue; }
        grid.push({ ms: Math.round(tau * 1000), hits: pathHits(toDive(cp(s)), [], list, R) });
      }
      windowsOf(grid, list);
      const keep = list.filter(f => msW(f.window) >= P.minWindowMs - 1e-9);
      const union = windowsOf(grid, keep);
      const trajN = new Set(keep.map(f => f.traj)).size, coreN = keep.filter(f => f.traj === 0).length;
      if (coreN < P.coreMin) return { fail: 'core' };
      if (trajN < P.minTraj) return { fail: 'traj' };
      if (msW(union) < P.minRowWindowMs - 1e-9) return { fail: 'window' };
      return { kind: 'red', op: 'release', flowers: keep, window: union, coreMs: Math.round(core.tau * 1000), deltaMs: Math.round(delta * 1000), K: 2 * half + 1,
        landLeafId: core.leaf ? core.leaf.id : null, landLeafX: core.leaf ? core.leaf.x : null };
    };
    // 白い組（ブレーキ軌道上の3輪1組）／モリアオは滑空軌道。操作時刻＝押下の時刻（ms、離陸から）
    //   glide=false：押下 π → 保持 180ms でブレーキ開始 σ=π+0.18、残量いっぱい保持
    //   glide=true（モリアオ）：σ=max(π+0.18, 頂点)、滑空の持ち時間いっぱい保持
    const holdStart = (b0, Tc, pi, glide) => {
      const apex = Math.max(0, b0.vy / C.gravity), sg = glide ? Math.max(pi + HOLD, apex) : pi + HOLD;
      if (pi < R5.input.lockMs / 1000 - EPS) return null;
      if (!(Tc - sg > RESERVE + EPS)) return null;   // 開始時点で接触まで 220ms より前
      return sg;
    };
    // r40：滑空は推進つき→推進なしの区間列（推進のない系統は従来どおり1区間）。持ち時間・推進は離陸直後の満タンの値
    const holdPhases = glide => glide ? glidePhases(F.glide.ms / 1000, thrustFull()).map(([m, dur]) => ({ m, dur })) : [{ m: BRAKE, dur: R5.brake.budget }];
    // 区間列 phases に沿って q を t 秒進める（区間列の外＝通常物理には進めない。1区間なら move(q, m, min(t, dur)) と同じ）
    const movePhases = (q, phases, t) => {
      let left = t;
      for (const ph of phases) { const d = Math.min(left, ph.dur); move(q, ph.m, d); left -= d; if (!(left > 0)) break; }
      return q;
    };
    const placeHold = (b0, Tc, us, ctx, kind, glide) => {
      const FL = R5.flowers, P = glide ? FL.glide : FL.white, W = FL.white, R = FL.radius, step = FL.stepMs / 1000;
      const atT = (glide ? FL.glide.atMs : W.atMs) / 1000, apex = Math.max(0, b0.vy / C.gravity);
      const Q = sg => movePhases(stateAt(b0, sg), holdPhases(glide), atT);
      // 開始時刻の範囲：頂点 + afterApexMs 以降、開始時の高さ ≥ minStartHeight、押下は離陸ロック後
      const sLo = Math.max(apex + P.afterApexMs / 1000, glide ? HOLD : R5.input.lockMs / 1000 + HOLD);
      let sHi = null;
      for (let sg = sLo; sg < Tc; sg += step) { if (stateAt(b0, sg).y >= P.minStartHeight && Tc - sg > RESERVE + atT) sHi = sg; else break; }
      if (sHi == null || !(sHi > sLo)) return { fail: 'S' };
      const red = ctx.reds || [];
      const after = R5.input.diveAfterMs / 1000, lo0 = R5.flowers.red.minFireMs / 1000;
      let lastFail = 'pos';
      for (let k = 0; k < W.tries; k++) {
        const sg = sLo + us[k] * (sHi - sLo);
        let list = [];
        if (glide && kind === 'red') {
          // モリアオの赤：1本の滑空軌道に沿って redCount 輪（中央が大輪）
          const s0 = stateAt(b0, sg), pts = pathPts(s0, holdPhases(true));
          const i0 = Math.round(atT / C.substep), a0 = arcAtStep(pts, i0);
          for (let j = 0; j < FL.glide.redCount; j++) {
            const at = atArc(pts, a0 + R5.flowers.red.gapPx * j); if (!at) break;
            list.push({ x: at.x, y: at.y, kind: 'red', traj: 0, k: j, big: j === 1, value: j === 1 ? 2 : 1 });
          }
        } else {
          // 白：開始時刻を Δ ずつずらした3本の、開始 atMs 後の点（隣との間隔 sepPx）
          const q0 = Q(sg);
          let dA = 0.004, dZ = 0.6;
          const dd = d => { const q = Q(sg + d); return Math.hypot(q.x - q0.x, q.y - q0.y); };
          if (dd(dZ) < W.sepPx || sg + dZ >= Tc) { lastFail = 'delta'; continue; }
          for (let i = 0; i < 30; i++) { const mid = (dA + dZ) / 2; if (dd(mid) < W.sepPx) dA = mid; else dZ = mid; }
          for (const j of [-1, 0, 1]) { if (sg + j * dZ < sLo || sg + j * dZ > sHi) continue; const q = Q(sg + j * dZ); list.push({ x: q.x, y: q.y, kind, traj: j, k: 0, big: false, value: 1 }); }
        }
        // 位置の条件：高さ・無操作軌道からの離隔・赤い花からの距離
        const minH = kind === 'red' ? R5.flowers.red.minHeight : C.leafY + FL.clearPx;
        list = list.filter(f => f.y >= minH && polyDist(ctx.noop, f.x, f.y) >= FL.clearPx && red.every(r => Math.hypot(r.x - f.x, r.y - f.y) >= W.minRedPx));
        if (kind === 'white' && list.length < 3) { lastFail = 'pos'; continue; }
        if (kind === 'red' && list.length < 2) { lastFail = 'pos'; continue; }
        list.forEach((f, i) => { f.id = -(i + 1); });
        // 白（モリアオ以外）：どのダイブ軌道でも取れない（ダイブで取れると「ブレーキで取る花」にならない）
        if (!glide) {
          let bad = false;
          for (let tau = lo0; tau < Tc && !bad; tau += step) {
            const s = stateAt(b0, tau);
            if (!(diveContact(s) >= after - EPS)) continue;
            if (pathHits(toDive(cp(s)), [], list, R).size) bad = true;
          }
          if (bad) { lastFail = 'dive'; continue; }
        }
        // 取得窓（押下の時刻）。保持は持ち時間いっぱい
        const grid = [];
        const p0 = R5.input.lockMs / 1000, p1 = Tc - 1e-6;
        for (let n = Math.ceil(p0 / step - 1e-9); n * step <= p1 + 1e-12; n++) {
          const pi = n * step, s = holdStart(b0, Tc, pi, glide);
          if (s == null) { grid.push({ ms: Math.round(pi * 1000), hits: new Set() }); continue; }
          grid.push({ ms: Math.round(pi * 1000), hits: pathHits(stateAt(b0, s), holdPhases(glide), list, R) });
        }
        windowsOf(grid, list);
        const minW = kind === 'red' ? R5.flowers.red.minWindowMs : 0;
        const keep = list.filter(f => msW(f.window) >= minW - 1e-9 && f.window);
        const union = windowsOf(grid, keep);
        const need = kind === 'red' ? R5.flowers.red.minRowWindowMs : W.minWindowMs;
        if ((kind === 'white' && keep.length < 3) || (kind === 'red' && keep.length < 2)) { lastFail = 'window'; continue; }
        if (msW(union) < need - 1e-9) { lastFail = 'window'; continue; }
        return { kind, op: 'press', flowers: keep, window: union, coreMs: Math.round((sg - HOLD) * 1000), glide, startMs: Math.round(sg * 1000) };
      }
      return { fail: lastFail };
    };
    // 離陸ごとの花の配置（葉離陸・速さ ≥ minSpeed のとき）。乱数は rngD を毎回6回だけ引く（結果によらず同じ回数）
    const spawnFlowers35 = () => {
      const u = [rngD(), rngD(), rngD(), rngD(), rngD(), rngD()];
      const Tc = downCross(b, NORMAL, C.leafY);
      if (!isFinite(Tc)) return;
      const ctx = { noop: pathPts(b, []), reds: [] }, b0 = cp(b), FL = R5.flowers;
      const wantRed = u[0] < F.redRate, wantWhite = u[1] < F.whiteRate && skipStock < FL.skip.max;
      const tries = [];
      if (F.glide) {
        // モリアオ：赤も白も滑空軌道。1離陸にどちらか一方だけ（両方当たったら u[2] で選ぶ）
        const pick = wantRed && wantWhite ? (u[2] < 0.5 ? 'red' : 'white') : wantRed ? 'red' : wantWhite ? 'white' : null;
        if (pick) tries.push([pick, () => placeHold(b0, Tc, [u[3], u[4], u[5]], ctx, pick, true)]);
      } else {
        if (wantRed) tries.push(['red', () => placeRed(b0, Tc, u[2], ctx)]);
        if (wantWhite) tries.push(['white', () => placeHold(b0, Tc, [u[3], u[4], u[5]], ctx, 'white', false)]);
      }
      for (const [kind, fn] of tries) {
        const g = fn();
        if (g.fail) { emit('flowerSkip', { kind, reason: g.fail, speed: Math.hypot(b.vx, b.vy) }); continue; }
        g.id = ++groupSeq;
        // r37：応援で上乗せされた分の出現か（抽選値が応援なしの出現率以上）。カットインの応援発動の判定用の注記で、乱数・配置は変えない
        const B0 = effectiveParams(frog.id, false), cheerPart = kind === 'red' ? u[0] >= B0.redRate : u[1] >= B0.whiteRate;
        for (const f of g.flowers) { f.id = ++flowerSeq; f.group = g.id; f.taken = false; f.cheer = cheerPart; }
        if (kind === 'red') ctx.reds = g.flowers;
        groups.push(g); flowers.push(...g.flowers);
        emit('flowerSpawn', { group: g.id, kind, op: g.op, tkJudgeMs: tJudge, tkPhysMs: tPhys * 1000, speed: Math.hypot(b.vx, b.vy),
          window: g.window.slice(), coreMs: g.coreMs, deltaMs: g.deltaMs || null, K: g.K || null, glide: !!g.glide, landLeafId: g.landLeafId == null ? null : g.landLeafId,
          flowers: g.flowers.map(f => ({ id: f.id, x: f.x, y: f.y, kind: f.kind, big: f.big, value: f.value, traj: f.traj, window: f.window.slice() })) });
      }
    };
    // 取得：区間 [0, tEnd]（モード m）で半径に入った花を時刻順に処理する。赤は速度を即時に増やす
    const pickFlowers = (m, tEnd, picked = null) => {
      const FL = R5.flowers, hit = picked || [];
      for (const f of picked ? [] : flowers) { if (f.taken) continue; const th = segHit(b, m, tEnd, f, FL.radius); if (th != null) hit.push([th, f]); }
      if (!hit.length) return;

      for (const [th, f] of hit) {
        if (f.taken) continue; // 白の組で先に1輪取ると、残りは散っている
        f.taken = true;
        const q = cp(b); move(q, m, th);
        if (f.kind === 'red') {
          const before = { vx: b.vx, vy: b.vy }; flowerBoost(b); fstats.red += 1; nextDirty = true;
          emit('flowerGet', { id: f.id, group: f.group, kind: 'red', value: f.value, big: f.big, mul: 1.3, before, after: { vx: b.vx, vy: b.vy }, x: q.x, y: q.y, state, cheer: !!f.cheer });
        } else {

          const ids = [];
          for (const o of flowers) if (o.group === f.group && !o.taken) { o.taken = true; o.scattered = true; ids.push(o.id); }
          emit('flowerGet', { id: f.id, group: f.group, kind: 'white', value: 1, big: false, stock: skipStock, x: q.x, y: q.y, state, cheer: !!f.cheer });
          if (ids.length) emit('flowerScatter', { group: f.group, ids });

    };
    // 「いま押して offMs 後に離したら」のダイブ（表示専用）。押下が離陸ロック・着地予約に入る、発動前に接触する、締切後なら null
    //   押下中（保持 180ms 未満）なら、押し始めから offMs で離すとみなして残りの時間で計算する
    const tapDiveFrom = offMs => {
      if (state !== 'FLYING' || F.glide || diveUsed) return null;
      let off = offMs / 1000;
      if (hold) { if (holdDone) return null; off = Math.max(0, off - holdT); }
      else {
        if (tPhys - tkT < R5.input.lockMs / 1000 - EPS) return null;
        const nx = getNext(); if (nx && nx.at - tPhys <= RESERVE + EPS) return null;
      }
      const p = cp(b);
      if (nextContactT(p) <= off) return null;
      move(p, NORMAL, off);
      const tc = diveContact(p);
      if (!(tc >= R5.input.diveAfterMs / 1000 - EPS)) return null;
      return { p, tc, off };
    };
    // r36: immediate release, no assumed tap duration. Simulate pickups without mutating play state.
    const simTapDive = () => {
      const s = tapDiveFrom(0); if (!s) return null;
      const q = toDive(cp(s.p)), taken = new Set(); let elapsed = 0, approx = false;
      for (let guard = 0; guard < 8000; guard++) {
        let h = C.substep, target = false;
        const tl = downCross(q, NORMAL, C.leafY);
        if (tl <= h) { h = tl; target = true; }
        let hit = null;
        for (const f of flowers) if (!f.taken && !taken.has(f.id)) {
          const th = segHit(q, NORMAL, h, f, R5.flowers.radius);

        }
        if (hit) {
          move(q, NORMAL, hit.th); elapsed += hit.th; taken.add(hit.f.id);
          if (hit.f.kind === 'red') { flowerBoost(q); approx = true; }

        }
        move(q, NORMAL, h); elapsed += h;

          safe: isSafe(lf), size: lf ? lf.size : null, approx, fireInMs: 0, etaMs: elapsed * 1000, holding: hold }; }

    };
    // カメラ用：ダイブで狙える範囲 [max(いま, 頂点), 締切] の着地点（締切＝ダイブ後の接触 diveAfterMs。葉の高さの交点で近似）
    const aimRange35 = () => {
      if (state !== 'FLYING' || F.glide || diveUsed) return null;
      const tA = Math.max(0, b.vy / C.gravity), after = R5.input.diveAfterMs / 1000;
      const f = tau => downCross(toDive(stateAt(b, tau)), NORMAL, C.leafY);
      if (!(f(tA) >= after)) return null;
      let a = tA, z = Math.max(tA, nextContactT(cp(b)));
      for (let i = 0; i < 40; i++) { const mid = (a + z) / 2; if (f(mid) >= after) a = mid; else z = mid; }
      if (!(a > tA)) return null;
      let x0 = Infinity, x1 = -Infinity;
      for (let i = 0; i <= 16; i++) { const x = diveLand(stateAt(b, tA + (a - tA) * i / 16)); if (x != null) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); } }
      return x0 <= x1 ? { x0, x1, tA, tZ: a } : null;
    };

    /* ----- FEVER ----- */
    const endFever = reason => {
      feverDistances.length = 0;
      if (!fever) return;
      fever = false; feverLeft = 0;
      emit('fever', { active: false, reason });
    };

    /* ----- ハイビスカス配置：無操作軌道から外し、ブレーキ／滑空の軌道上に置く ----- */
    const spawnFlower = () => {
      const r0 = rngB(), r1 = rngB(), r2 = rngB(), r3 = rngB();
      // r3.5：旧花（×1.3 の単独花）は置かない。4回の乱数は引いたままにし、葉・保証葉の乱数列を r3.2 と同じに保つ（DESIGN_R35 D-2-8）
      if (fl5()) return;
      if (r0 >= F.flowerRate) return;
      const FL = C.flower, apexT = b.vy / C.gravity, landT = downCross(b, NORMAL, C.leafY), lead = FL.leadMs / 1000;
      let leadFail = false, adjusted = 0;
      const base = t => { const p = { x: b.x, y: b.y, vx: b.vx, vy: b.vy }; move(p, NORMAL, t); return p; };
      const clear = q => {
        let dmin = Infinity;
        for (let i = 0; i <= 240; i++) { const p = base(landT * i / 240); dmin = Math.min(dmin, Math.hypot(p.x - q.x, p.y - q.y)); }
        return dmin >= FL.minClear * FL.radius && q.y >= C.leafY + FL.minHeight;
      };
      const tryPlace = (type, t0, tau) => {
        const s = base(t0), q = { x: s.x, y: s.y, vx: s.vx, vy: s.vy };
        if (type === 'glide') movePhases(q, holdPhases(true), tau); else move(q, BRAKE, tau);   // r40：滑空は推進の区間列に沿う（tau ≤ 滑空の持ち時間）
        if (!clear(q)) return false;
        // 400ms 規則 (a)：想定の取得時刻（離陸から t0+tau）が、無操作軌道での接触時刻の 400ms 前より手前
        // 400ms 規則 (b)：想定経路で取得した直後（加速後・通常物理）から葉の高さへ下降するまでが 400ms 以上
        const a = cp(q); flowerBoost(a); // r39：赤花の式は flowerBoost に一本化（sp≤2200 は従来と同じ演算）
        const after = downCross(a, NORMAL, C.leafY);
        if (t0 + tau > landT - lead + EPS || !(after >= lead - EPS)) { leadFail = true; return false; }
        flower = { id: ++flowerSeq, x: q.x, y: q.y,
          hint: { type, at: tPhys + t0, x: s.x, y: s.y, tau, leadMs: (landT - t0 - tau) * 1000, afterMs: after * 1000, adjusted } };
        return true;
      };
      // まず r2 と同じ手順で試す。400ms 規則で落ちた候補があったときだけ、開始時刻と持続を
      // 抽選範囲の下限側へ adjustSteps 段階で寄せて試し直す（乱数は追加で引かない）
      const place = (type, P, tauCap, r2Retry) => {
        const cand = f => [apexT * (P.uMin + P.uRange * r1 * f), Math.min(P.tauMin + P.tauRange * r2 * f, tauCap)];

    /* ----- 離陸 ----- */
    // angleDeg を省略＝55度固定（発射・水切り復帰）。葉のバウンドだけ入射角バウンドの角度を渡す
    // v3.1：v は基準速度（判定倍率・最低速度の判定はこちら）。実際の軌道は成長ランプを掛けた va で飛ぶ。
    // 水切り復帰（fromLeaf=false、水面 y=0 から）にはランプを掛けない：skip.min 600px/s に 0.55 を掛けると
    // 頂点が葉の高さ 120px に届かず、救済が必ず失敗するため

    // r47：cap＝judge で決めた速度上限（launchV.cap。FEVER 中のバウンドは C.fever.maxSpeed）。省略は従来の C.maxSpeed

      const va = launchSpeedAt(v, fromLeaf ? rampScale(meters()) : 1, E, cap);

      tkT = tPhys; tkJ = tJudge; brakeBudget = R5.brake.budget; holdDone = false;
      if (fl5()) { flowers = []; groups = []; }
      setGuar(null); guarOwn = null;

    /* ----- 空中の状態変化 ----- */
    // r3.5：保持型。開始時の brakeLeft は「この離陸の残量」（残量いっぱい保持する前提で保証葉を解く）
    const startBrake = () => {
      brakeLeft = in5() ? brakeBudget : C.brake.duration;
      if (b.vy < -BRAKE.cap) b.vy = -BRAKE.cap;
      setState('BRAKING'); nextDirty = true;
      emit('brake', { x: b.x, y: b.y, budgetMs: brakeLeft * 1000 });
      updateGuarantee();
    };
    // r3.5：保持型ブレーキの終了（解放・残量切れ・中断）。残量を持ち越し、現在位置から保証葉を解き直す
    const endBrake = reason => {

    const tapRelease = ht => {
      let reason = null;
      if (state !== 'FLYING') reason = 'state';
      else if (diveUsed) reason = 'used';

      else if (!(diveContact(b) >= R5.input.diveAfterMs / 1000 - EPS)) reason = 'late';

    };
    const startDive = () => {
      const sp = Math.hypot(b.vx, b.vy);

      diveUsed = true;
      diveStartY = b.y;

    };

      setState('FLYING'); nextDirty = true;
      emit('glide', { active: false, left: glideLeft });

    };

    /* ----- 進捗（マイルストーン・ベストライン） ----- */
    const progress = () => {
      const d = meters();
      let ms = null;
      while (d >= nextMs) { ms = nextMs; nextMs = nextMilestone(nextMs); }
      if (bestAtStart > 0 && !bestPassed && d > bestAtStart) {
        bestPassed = true;
        emit('bestLine', { distance: d, milestone: ms });
      } else if (ms != null) emit('milestone', { meters: ms });
    };

    /* ----- 空中積分（解析解・最大1/120秒刻み） ----- */
    const advance = (t, m) => {
      // r39 BIG AIR v2（記録専用。物理には触れない）：上昇中なら区間内の頂点を解析的に求める（move と同じ式）
      if (b.vy > 0) { const ta = Math.min(t, b.vy / m.g), ya = b.y + b.vy * ta - 0.5 * m.g * ta * ta; if (ya > segApexY) segApexY = ya; }
      move(b, m, t);
      if (b.y > segApexY) segApexY = b.y;
      tPhys += t; tJudge += t * 1000;
      if (state === 'BRAKING') brakeLeft -= t;
      if (state === 'GLIDING') {
        glideLeft -= t; segGlide += t;
        // r40：推進を使った時間。使い切ったら接触予測を取り直す（区間列で予測済みなので値は変わらないが、念のため）
        if (thrustLeft > EPS) { thrustLeft -= t; if (thrustLeft <= EPS) { thrustLeft = 0; nextDirty = true; } }
      }
      if (hold) holdT += t;
      if (fever) { feverLeft -= t; feverElapsed += t; }
      if (b.x > maxX) { maxX = b.x; progress(); }
    };
    // 花の取得半径に入る最初の時刻（刻み幅に依存しないよう二分法で解く）
    // r3.2：照準の予測からも使えるよう、物体 bd と花 fl を引数で受け取れるようにした（既定は実物）
    const flowerHitTime = (m, h, bd = b, fl = flower) => {
      const R = C.flower.radius, p = { x: 0, y: 0, vx: 0, vy: 0 };
      const dist = t => { p.x = bd.x; p.y = bd.y; p.vx = bd.vx; p.vy = bd.vy; move(p, m, t); return Math.hypot(p.x - fl.x, p.y - fl.y); };
      if (dist(0) <= R) return 0;
      const x0 = bd.x, y0 = bd.y, d1 = dist(h), dx = p.x - x0, dy = p.y - y0, l2 = dx * dx + dy * dy;
      const u = l2 > 0 ? clamp(((fl.x - x0) * dx + (fl.y - y0) * dy) / l2, 0, 1) : 0;
      let hi = d1 <= R ? h : u * h;
      if (dist(hi) > R) return null;
      let lo = 0;
      for (let i = 0; i < 48; i++) { const mid = (lo + hi) / 2; if (dist(mid) <= R) hi = mid; else lo = mid; }
      return hi;
    };
    const stepAir = maxDt => {
      const r5 = in5() && !F.glide; // r3.5 の入力（モリアオは滑空の規則のまま）

    function resolve(delta) {

// つなぎ：追加ポーズなし。アンカー統一（空中＝スプライト重心、接地中＝足裏）＋即時切替＋体軸角の平滑追従＋切替に同期したスクワッシュ＆ストレッチ。
// SPR_W＝表示幅（u＝13×体格の倍数）。全ポーズで画像の横幅は同じ 560px だが体の大きさが違うので、目の大きさの比から決めた（R37_NOTES）。
// SPR_AXIS＝画像の中の体軸の傾き（rad、正＝頭が下）。SPR_C0＝重心が測れなかったときの重心（画像比）
const SPR_W = { sit: 3.6, call: 4.1, jump: 7.1, fall: 4.3, brake: 5.9, brakecall: 6.3, dive: 5.3 };
const SPR_AXIS = { sit: 0, call: 0, jump: -0.18, fall: 0.22, brake: -0.08, brakecall: -0.12, dive: 0.55 };
const SPR_C0 = { sit: [.5, .55], call: [.55, .55], jump: [.6, .45], fall: [.5, .4], brake: [.5, .5], brakecall: [.55, .55], dive: [.55, .5] };
const SPR_GROUND = { sit: 1, call: 1 };
const sprMetrics = new Map();
function frogSprite(fam, pose) {
  const name = `frog_${fam}_${pose}`, im = art(name);

  let m = sprMetrics.get(name);

  try {

}
// エンジンのポーズ → スプライト。BRAKING（口膨らまし減速＝SPEC ポーズ6）は鳴嚢つきの brakecall、
// 押下中で保持が未確定の間（r35 の FLYING＋hold）は brake
// GLIDE_ART＝ダイブの枠（frog_<系統>_dive）に滑空の絵（glide）を入れた系統。ダイブを持たないのでこの枠は滑空にだけ使う。
// 滑空の絵は四肢を広げた水平の姿勢なので、表示幅・体軸の傾き・重心の既定値はダイブの絵と別に持つ（SPR_*_GLIDE）

const GLIDE_ART = new Set(['moriao', 'cobalt', 'kiobi']);

    case 'idle': return st === 'READY' && (t % 4200) < 700 ? 'call' : 'sit';   // 待機中のアクセント（ときどき鳴く）

// 画像でカエルを描く。原点＝足点（world、y は下向きの画面座標に変換済み）。描けたら true（描けなければ呼び出し側が図形描き）

    c.scale(o.sx || 1, o.sy || 1);

    const e = o.stretch || 0;

    c.rotate(-sprAxis(fam, sp));
    c.drawImage(m.im, -m.cx * k, -m.cy * k, m.w * k, m.h * k);

  return true;
}

/* ---- 葉の画像（大・中・小・金）。斜め上から見た形に整えた画像を一度だけ作って使い回す ---- */
// 大は斜めから描いた絵（横長）をやや平たく、中・小・金は真上から描いた絵（縦長）を 90°回して付け根を左・先端を右にし、奥行き方向へ潰す。

/* ---- ハイビスカス（赤＝即効×1.3／青＝水切り+1）。挙動は r36 のまま、見た目だけ画像 ---- */
// 画像の花の中心（画像比）と、花の半径に対する画像の横幅

    r: Math.random() * 6, vr: (Math.random() - .5) * 12, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, col: CONF_COL[i % 6], life: 4 + Math.random() * 2 });

function drawConfetti(dt) {
  if (!fx.confetti.length && !fxDirty) return;
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H); fxDirty = fx.confetti.length > 0;
  for (let i = fx.confetti.length - 1; i >= 0; i--) {
    const p = fx.confetti[i]; p.life -= dt; if (p.life <= 0 || p.y > H + 30) { fx.confetti.splice(i, 1); continue; }
    p.x += (p.vx + Math.sin(p.r * 2) * 30) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.scale(1, Math.abs(Math.cos(p.r * 1.7)) + .15);
    fctx.globalAlpha = Math.min(1, p.life); fctx.fillStyle = p.col; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fctx.restore();

}
function drawResultGirl(t) {
  const c = gctx, r = resultInfo, S = GCV_W; c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, GCV_W, GCV_H);
  c.fillStyle = 'rgba(80,160,80,.25)'; ell(c, S * 62 / 130, S, S * 40 / 130, 6); c.fill();
  const celebrate = r && (r.isNewBest || r.newly.length);
  const family = r ? K.familyOf(r.frogId) : eng.view.frog.family;
  const girl = girlOf(family);
  // r44：出迎え（新記録でないとき）は、るりだけ専用の welcome ポーズ。他の相棒は従来どおり wave
  const im = art(`full_${girl}_${celebrate ? 'celebrate' : girl === 'ruri' ? 'welcome' : 'wave'}`);
  if (im) {
    const k = S / Math.max(im.naturalWidth, im.naturalHeight);
    const w = im.naturalWidth * k, h = im.naturalHeight * k;
    const elapsed = t - resultStartT;
    // 120ms で跳ね上がり、600ms までに元の位置へ戻る
    const jump = elapsed < 120 ? GCV_PAD * (1 - (1 - elapsed / 120) ** 2)
      : GCV_PAD * (1 - clamp((elapsed - 120) / 480, 0, 1)) ** 2;
    c.drawImage(im, (S - w) / 2, GCV_PAD + (S - h) / 2 - jump, w, h);

    c.save(); c.translate(S * 62 / 130, S); c.scale(1.08 * S / 130, 1.08 * S / 130);

}

/* ================= HUD ================= */
const hudCache = {};
const setH = (id, html) => { if (hudCache[id] !== html) { hudCache[id] = html; $(id).innerHTML = html; } };
function updateHUD(v) {
  const st = v.state, h = v.hud, inRun = st !== 'TITLE';
  $('hudL').style.visibility = inRun ? 'visible' : 'hidden';
  $('bPause').style.visibility = (st === 'TITLE' || st === 'GAME_OVER') ? 'hidden' : 'visible';
  $('bPause').textContent = st === 'PAUSED' ? '▶' : '⏸';
  // r38 C2：水切りの残数は距離の右に「💧×N」（0 のときも出す）
  setH('hDist', `${f1(h.distance)}<small>m</small><span class="skips">💧×${h.skipsLeft || 0}</span>`);
  // r38 C1：ベストの残り50m 以内（エンジンの bestRemaining）は「ベストまで あと ◯m」
  setH('hBest', h.bestRemaining != null ? `<span class="near">ベストまで あと ${c1(h.bestRemaining)}m</span>` : `ベスト ${f1(h.best)}m`);
  setH('hAir', h.airOver ? `BIG AIR ${f1(h.airLive)}m 更新中！` : '');   // r37：ベストを超えた飛行の間だけ（常時の行は足さない）
  // r38 C6：コンボの右に FEVER ゲージ（枠＝系統の feverNeed、点灯＝HUD の feverChain）。
  // r44：FEVER 中の残り時間バーは上部中央の帯のゲージに移し、HUD は「FEVER ◯秒」の文字だけにする
  const need = Math.max(1, h.feverNeed || K.FROG_DEFAULTS.feverNeed), lit = clamp(h.feverChain, 0, need);
  const gauge = h.fever
    ? `<span class="fv">FEVER ${h.feverLeft.toFixed(1)}秒</span>`
    : inRun && st !== 'READY' && st !== 'CHARGING' ? `<span class="fv">FEVER${lit === need ? ' READY' : ''} ${'●'.repeat(lit)}${'○'.repeat(need - lit)}</span>` : '';
  setH('hCombo', (h.combo >= 2 ? `${h.combo} コンボ` : '') + gauge);
  setH('hFever', '');
  setH('hGlide', h.glideLeftMs != null ? `滑空 ${(h.glideLeftMs / 1000).toFixed(1)}秒` : '');
  // ダイブ使用可否（モリアオ以外）。r38 C2：使えないときは「ダイブ ×」。ブレーキ残量はブレーキ中か残り0.8秒未満のときだけ
  const showDive = h.longPress === 'dive' && h.diveAvailable != null && divesTaught() && st !== 'READY' && st !== 'CHARGING';
  const brakeMs = h.brakeBudgetMs || 0, showBrake = h.glideMaxMs == null && inRun && (st === 'BRAKING' || brakeMs < 800);
  setH('hDive', [showDive ? (h.diveAvailable ? 'ダイブ OK' : 'ダイブ ×') : '', showBrake ? `ブレーキ ${(brakeMs / 1000).toFixed(1)}秒` : ''].filter(Boolean).join('　'));
  $('hDive').classList.toggle('used', showDive && !h.diveAvailable);
}

/* ================= ループ ================= */
let last = nowMs();
function frame() {
  const t = nowMs(), dt = Math.min(.05, (t - last) / 1000); last = t;
  const before = eng.view.hud.distance;
  bestLineThisFrame = false;
  const v = eng.update(t);
  updateBgm(v); stepBgmFade();
  if (!bestLineThisFrame) {
    const crossed = extraMilestones.find(m => before < m && m <= v.hud.distance);
    if (crossed != null) showMilestone(crossed);
  }
  if (AU.charge && v.state === 'CHARGING') AU.charge.o.frequency.setTargetAtTime(220 + 660 * v.hud.charge, AU.ctx.currentTime, .015);
  // r37：モリアオの応援発動（1離陸の滑空累計が通常の上限を超えた瞬間）。r40：応援で持ち時間が伸びる系統（コバルト＝るり）も同じ規則
  if (!fx.glideCheer && v.hud.glideMaxMs != null && v.hud.glideLeftMs != null) {
    const base = (K.frogById(v.frog.family).params.glide || {}).ms || 1500;
    if (v.hud.glideMaxMs > base && v.hud.glideMaxMs - v.hud.glideLeftMs > base) { fx.glideCheer = true; announce('cheer'); }
  }
  // ステージ到達の保留分は、表示中の FEVER カットインが終了してから到達順に出す（r46：bigPop＋声。notBefore はベスト越えと同時の分）。
  if (v.state === 'SINKING' || v.state === 'GAME_OVER' || v.state === 'TITLE') {
    pendingStageCutins.length = 0; fx.feverCutin = null; voicePending = null;   // r47：場面がプレイから離れたら遅延中の応援も取り消す
  } else if (v.state !== 'PAUSED') {
    stepVoicePending(t);   // r47：着地・連鎖の応援の遅延発声（採用決定の 150ms 後）
    stepFeverCutin(t);   // r46：FEVER 突入カットインの表示予定（溜めの後に一度だけ）
    if (pendingStageCutins.length && !bigCutinShowing(t) && t >= pendingStageCutins[0].notBefore) {
      const { cap } = pendingStageCutins.shift();
